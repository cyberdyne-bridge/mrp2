    <text x="16.0" y="14" fill="#fff" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11" text-anchor="middle">KMS</text>
    <text x="58.0" y="15" fill="#010101" fill-opacity=".3">120 Hz</text>
